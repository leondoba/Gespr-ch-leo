name: Construire l'APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dézipper app.zip si présent
        run: |
          if [ -f app.zip ]; then unzip -o -q app.zip; echo "app.zip extrait"; fi
      - name: Vérifier que main.dart est complet
        run: |
          test -f lib/main.dart || { echo "lib/main.dart manquant"; exit 1; }
          lines=$(wc -l < lib/main.dart)
          echo "main.dart : $lines lignes"
          test "$lines" -ge 400 || { echo "main.dart est incomplet (coupé)"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 setup.py
      - run: flutter pub get
      - name: Vérifier le code (rapide)
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: gespraech-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
